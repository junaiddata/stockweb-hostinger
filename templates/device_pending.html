<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Approval</title>
    <meta http-equiv="refresh" content="30">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #001e3c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 48px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon-container {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 152, 0, 0.15));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
        }
        
        .icon {
            font-size: 48px;
            animation: spin 3s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 193, 7, 0.4);
            border-radius: 50%;
            animation: pulse 2s ease-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        h2 {
            color: white;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .highlight {
            color: #ffc107;
            font-weight: 600;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            color: white;
            padding: 14px 28px;
            border-radius: 25px;
            margin-top: 24px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(25, 118, 210, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(25, 118, 210, 0.4);
        }
        
        .auto-refresh {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .decoration {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
        
        .decoration-1 {
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.08) 0%, transparent 70%);
        }
        
        .decoration-2 {
            bottom: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(25, 118, 210, 0.08) 0%, transparent 70%);
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="card">
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <span class="icon">⏳</span>
        </div>
        <h2>Approval Pending</h2>
        <p>Your device registration request has been submitted.</p>
        <p>Please ask an admin to approve your device under <span class="highlight">"Device Management"</span></p>
        <a href="/device-pending" class="btn">
            <span>🔄</span> Check Status
        </a>
        <p class="auto-refresh">Page auto-refreshes every 30 seconds</p>
    </div>
</body>
</html>
