server {
    server_name stock.junaidworld.com;
    client_max_body_size 100M;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # --- Serve static files directly (bypass Gunicorn) ---
    location /static/ {
        alias /var/www/stockweb/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SSE endpoint (long-lived connections) ---
    location /api/stock-stream/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/stockweb/stockweb.sock;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_set_header Upgrade '';
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- All other endpoints ---
    location / {
        include proxy_params;
        proxy_pass http://unix:/var/www/stockweb/stockweb.sock;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stock.junaidworld.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stock.junaidworld.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = stock.junaidworld.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name stock.junaidworld.com;
    return 404; # managed by Certbot
}
